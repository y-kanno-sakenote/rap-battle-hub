<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>ラップバトル｜SAKENOTE</title>
<meta name="description" content="醸造・ワイン・焼酎・調味料。好きな顔ぶれで、韻のバトルを。">
<meta property="og:title" content="ラップバトル｜SAKENOTE">
<meta property="og:description" content="醸造・ワイン・焼酎・調味料。好きな顔ぶれで、韻のバトルを。">
<meta property="og:type" content="website">
<style>
  /* 地は無彩色に近く置き、4作の色はカードの差し色（作品名＝表の色、左の線＝地の色）にだけ使う */
  :root{
    --bg:#0e0d0c; --card:#191715; --line:#2c2925; --ink:#f3eee6; --sub:#a39b90;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .brew    {--c1:#e8c15a; --c2:#c99a2e}  /* 金 */
  .wine    {--c1:#e3aaa2; --c2:#9c3b4c}  /* ロゼ×ボルドー */
  .shochu  {--c1:#d4936a; --c2:#46689a}  /* 甕の土色×藍 */
  .chomiryo{--c1:#a9c77e; --c2:#8a5634}  /* 萌葱×醤油色 */
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f1e9; --card:#fffdf9; --line:#ddd4c6; --ink:#1f1a15; --sub:#6b6258}
    .brew    {--c1:#8a6514; --c2:#c99a2e}
    .wine    {--c1:#8e2f42; --c2:#d79a93}
    .shochu  {--c1:#9a5230; --c2:#3c5f93}
    .chomiryo{--c1:#3d6a32; --c2:#8a4f2a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:40px 16px 48px}
  header{text-align:center;margin-bottom:28px}
  h1{font-family:var(--mincho);font-size:clamp(26px,7vw,40px);font-weight:900;margin:0;line-height:1.3}
  .tag{color:var(--sub);font-size:14px;margin:10px 0 0}
  .list{display:grid;grid-template-columns:1fr;gap:12px;margin:0;padding:0;list-style:none}
  @media (min-width:640px){ .list{grid-template-columns:1fr 1fr;gap:16px} }
  .card{display:block;height:100%;padding:18px 18px 16px 20px;background:var(--card);color:inherit;
        text-decoration:none;border:1px solid var(--line);border-left:4px solid var(--c2);border-radius:10px}
  .card:hover{border-color:var(--c2)}
  .card:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
  .card h2{font-family:var(--mincho);font-size:20px;font-weight:800;margin:0;color:var(--c1)}
  .cast{font-size:26px;line-height:1.3;margin:8px 0 4px;letter-spacing:.12em}
  .stage{color:var(--sub);font-size:14px;margin:0}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:36px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SAKENOTE ラップバトル</h1>
    <p class="tag">好きな顔ぶれで、韻のバトルを。</p>
  </header>

  <ul class="list">
    <li><a class="card brew" href="https://jozorap.sakenote.net/">
      <h2>醸造ラップバトル</h2>
      <p class="cast"><span role="img" aria-label="麹菌" title="麹菌">🌾</span><span role="img" aria-label="清酒酵母" title="清酒酵母">🫧</span><span role="img" aria-label="杜氏" title="杜氏">👘</span><span role="img" aria-label="乳酸菌" title="乳酸菌">🦠</span><span role="img" aria-label="酒米" title="酒米">🍚</span></p>
      <p class="stage">舞台は蔵の中</p>
    </a></li>
    <li><a class="card wine" href="https://y-kanno-sakenote.github.io/wine-rap-battle/">
      <h2>ワインラップバトル</h2>
      <p class="cast"><span role="img" aria-label="カベルネ" title="カベルネ">👑</span><span role="img" aria-label="メルロー" title="メルロー">🍇</span><span role="img" aria-label="ピノ" title="ピノ">🍒</span><span role="img" aria-label="シャルドネ" title="シャルドネ">🌼</span><span role="img" aria-label="ソーヴィニヨン・ブラン" title="ソーヴィニヨン・ブラン">🌿</span></p>
      <p class="stage">舞台はブドウ畑</p>
    </a></li>
    <li><a class="card shochu" href="https://y-kanno-sakenote.github.io/shochu-rap-battle/">
      <h2>焼酎ラップバトル</h2>
      <p class="cast"><span role="img" aria-label="芋" title="芋">🍠</span><span role="img" aria-label="麦" title="麦">🌾</span><span role="img" aria-label="米" title="米">🍚</span><span role="img" aria-label="黒糖" title="黒糖">🏝️</span><span role="img" aria-label="泡盛" title="泡盛">🏺</span></p>
      <p class="stage">舞台は南の酒どころ</p>
    </a></li>
    <li><a class="card chomiryo" href="https://y-kanno-sakenote.github.io/chomiryo-rap-battle/">
      <h2>調味料ラップバトル</h2>
      <p class="cast"><span role="img" aria-label="醤油" title="醤油">🏯</span><span role="img" aria-label="味噌" title="味噌">🍲</span><span role="img" aria-label="みりん" title="みりん">✨</span><span role="img" aria-label="食酢" title="食酢">⚔️</span><span role="img" aria-label="清酒" title="清酒">🍶</span></p>
      <p class="stage">舞台は城下町</p>
    </a></li>
  </ul>

  <footer>歌詞はAIで書いたもの。© SAKENOTE</footer>
</div>
</body>
</html>
