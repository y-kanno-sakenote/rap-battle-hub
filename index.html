<!DOCTYPE html>
<!-- 担当: 🎨 UI/UX係（ジョブズ×ラムス）／比較案1「ステッカーを貼った壁」 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ラップバトル｜SAKENOTE</title>
<meta name="description" content="醸造・ワイン・焼酎・調味料。好きな顔ぶれで、韻のバトルを。">
<meta property="og:title" content="ラップバトル｜SAKENOTE">
<meta property="og:description" content="醸造・ワイン・焼酎・調味料。好きな顔ぶれで、韻のバトルを。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 見出しと作品名に使う字だけを取り寄せる（text=）ので軽い -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=SAKENOTEラップバトル醸造ワイン焼酎調味料">
<style>
  /* 黒固定。壁はコンクリ打ちっぱなし（型枠の目地＋Pコンの穴）をCSSだけで匂わせる程度 */
  :root{
    --ink:#f3eee6; --sub:#9d958a;
    --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    --display:"Dela Gothic One",var(--sans);
  }
  .brew    {--c1:#e8c15a; --r:-6deg}
  .wine    {--c1:#e3aaa2; --r:5deg}
  .shochu  {--c1:#d4936a; --r:4deg}
  .chomiryo{--c1:#a9c77e; --r:-5deg}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 24px 20px, #050505 2.5px, rgba(255,255,255,.07) 3.5px, transparent 4.5px) 0 0/180px 90px,
      radial-gradient(circle at 156px 20px, #050505 2.5px, rgba(255,255,255,.07) 3.5px, transparent 4.5px) 0 0/180px 90px,
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/180px 90px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/180px 90px,
      radial-gradient(ellipse at 15% 0%, #2b2826, transparent 60%),
      radial-gradient(ellipse at 90% 100%, #242120, transparent 55%),
      #171615;
    min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:44px 16px 48px}
  header{text-align:center;margin-bottom:36px}
  h1{margin:0;font-family:var(--display);font-weight:400;line-height:1.1;
     background:linear-gradient(#f7e08f,#d9ab3c 55%,#9a7116);-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 3px 0 #000)}
  h1 .en{display:block;font-size:clamp(18px,5.4vw,24px);letter-spacing:.18em;margin-bottom:6px}
  h1 .ja{display:block;font-size:clamp(40px,12vw,64px)}
  .tag{color:var(--sub);font-size:14px;margin:14px 0 0}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:28px 16px;margin:0;padding:0;list-style:none}
  .st{display:block;text-align:center;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  /* _cut.png の周りに白い縁（重ねた drop-shadow）＋壁に落ちる影でステッカーに見せる */
  .pic{display:block;width:86%;max-width:200px;height:auto;margin:0 auto;transform:rotate(var(--r));
       filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
              drop-shadow(0 8px 10px rgba(0,0,0,.6));
       transition:transform .18s ease}
  .st:hover .pic,.st:focus-visible .pic,.st:active .pic{transform:rotate(0) scale(1.04)}
  .st:focus-visible{outline:2px solid var(--c1);outline-offset:6px;border-radius:8px}
  .st h2{font-family:var(--display);font-weight:400;font-size:clamp(14px,4.2vw,18px);margin:14px 0 0;color:var(--c1);line-height:1.3}
  .stage{color:var(--sub);font-size:12px;margin:2px 0 0}
  .more{text-align:center;font-size:13px;margin:40px 0 0}
  .more a{color:var(--sub);text-underline-offset:3px}
  .more a:hover,.more a:focus-visible{color:var(--ink)}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
  @media (prefers-reduced-motion: reduce){ .pic{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="en">SAKENOTE</span><span class="ja">ラップバトル</span></h1>
    <p class="tag">好きな顔ぶれで、韻のバトルを。</p>
  </header>

  <ul class="list">
    <li><a class="st brew" href="https://jozorap.sakenote.net/">
      <img class="pic" src="img/jozo_cut.png" alt="醸造ラップバトルのキャラ" width="200" height="200" loading="eager">
      <h2>醸造ラップバトル</h2>
      <p class="stage">舞台は蔵の中</p>
    </a></li>
    <li><a class="st wine" href="https://y-kanno-sakenote.github.io/wine-rap-battle/">
      <img class="pic" src="img/wine_cut.png" alt="ワインラップバトルのキャラ" width="200" height="200" loading="eager">
      <h2>ワインラップバトル</h2>
      <p class="stage">舞台はブドウ畑</p>
    </a></li>
    <li><a class="st shochu" href="https://y-kanno-sakenote.github.io/shochu-rap-battle/">
      <img class="pic" src="img/shochu_cut.png" alt="焼酎ラップバトルのキャラ" width="200" height="200" loading="eager">
      <h2>焼酎ラップバトル</h2>
      <p class="stage">舞台は南の酒どころ</p>
    </a></li>
    <li><a class="st chomiryo" href="https://y-kanno-sakenote.github.io/chomiryo-rap-battle/">
      <img class="pic" src="img/chomiryo_cut.png" alt="調味料ラップバトルのキャラ" width="200" height="200" loading="eager">
      <h2>調味料ラップバトル</h2>
      <p class="stage">舞台は城下町</p>
    </a></li>
  </ul>

  <p class="more"><a href="zukan/">キャラ図鑑</a></p>

  <footer>歌詞はAIで書いたもの。© SAKENOTE</footer>
</div>
</body>
</html>
